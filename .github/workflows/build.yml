name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (e.g. v0.1.0) to build and attach to its release
        required: true

permissions:
  contents: write

env:
  # Tag being released, or "dev" for plain CI builds.
  VERSION: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'dev' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu = older glibc, so the binary runs on most distributions.
          - os: ubuntu-22.04
            name: x86_64-linux
          - os: windows-latest
            name: x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install libudev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: cargo clippy --release --locked
      - run: cargo test --release --locked
      - run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          dir="g435-tray-$VERSION-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/g435-tray packaging/linux/70-logitech-g435.rules packaging/linux/g435-tray.desktop \
             LICENSE THIRD-PARTY-NOTICES README.md README.it.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "g435-tray-$env:VERSION-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/g435-tray.exe, LICENSE, THIRD-PARTY-NOTICES, README.md, README.it.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            g435-tray-*.tar.gz
            g435-tray-*.zip

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum g435-tray-* > SHA256SUMS
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes
          gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber g435-tray-* SHA256SUMS
