[package]
name = "g435-tray"
version = "0.1.0"
edition = "2024"
description = "Tray icon with the battery level of the Logitech G435 headset (Linux and Windows)"
license = "MIT"
repository = "https://github.com/deddroid/logitech-g435-battery"
authors = ["deddroid", "Claude (Anthropic)"]

[dependencies]
hidapi = { version = "2.6", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target."cfg(windows)".dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
tray-icon = "0.26"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry"] }
